<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>06-hotkey-tray</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 24px 32px;
      background: #f8fafc;
      width: 1520px;
    }
    h1 {
      font: 600 15px/1.4 "Segoe UI", sans-serif;
      color: #334155;
      margin: 0 0 18px;
    }
    .block {
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid #e2e8f0;
    }
    .label {
      font: 11px/1.2 Consolas, monospace;
      color: #64748b;
      margin-bottom: 6px;
    }
    .line {
      font-size: 17px;
      line-height: 1.45;
      color: #0f172a;
      white-space: pre-wrap;
      word-break: break-word;
    }

  </style>
</head>
<body>
  <h1>06-hotkey-tray</h1>
  <div class="block">
    <div class="label">Segoe UI</div>
    <div class="line" style="font-family:Segoe UI, sans-serif">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">Microsoft YaHei</div>
    <div class="line" style="font-family:'Microsoft YaHei', sans-serif">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">SimSun</div>
    <div class="line" style="font-family:SimSun, 'NSimSun', serif">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">SimHei</div>
    <div class="line" style="font-family:SimHei, sans-serif">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">DengXian</div>
    <div class="line" style="font-family:DengXian, '等线', sans-serif">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">Arial</div>
    <div class="line" style="font-family:Arial, Helvetica, sans-serif">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">Times New Roman</div>
    <div class="line" style="font-family:'Times New Roman', Times, serif">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">Consolas</div>
    <div class="line" style="font-family:Consolas, monospace">Ctrl+Alt+W 截图并识别</div>
  </div>
  <div class="block">
    <div class="label">Courier New</div>
    <div class="line" style="font-family:'Courier New', monospace">Ctrl+Alt+W 截图并识别</div>
  </div>
</body>
</html>
