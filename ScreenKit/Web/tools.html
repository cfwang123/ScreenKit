<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>web工具集</title>
<link rel="stylesheet" href="/sk/fa.css?__SK_WEB_VER__"/>
<link rel="stylesheet" href="/sk/tools.css?__SK_WEB_VER__"/>
</head>
<body>
<div class="shell">
	<aside>
		<div class="brand">
			<span class="mark">S</span>
			<div>
				<strong>ScreenKit</strong>
				<small data-k="web.brand">本机工具</small>
			</div>
		</div>
		<nav id="cats">
			<button type="button" data-cat="fav" data-title="收藏" data-kt="web.cat.fav"><i class="fa-solid fa-star"></i><span data-k="web.cat.fav">收藏</span></button>
			<button type="button" data-cat="all" data-title="全部" data-kt="web.cat.all" class="on"><i class="fa-solid fa-border-all"></i><span data-k="web.cat.all">全部</span></button>
			<button type="button" data-cat="text" data-title="文字" data-kt="web.cat.text"><i class="fa-solid fa-font"></i><span data-k="web.cat.text">文字</span></button>
			<button type="button" data-cat="calc" data-title="计算" data-kt="web.cat.calc"><i class="fa-solid fa-calculator"></i><span data-k="web.cat.calc">计算</span></button>
			<button type="button" data-cat="speech" data-title="语音" data-kt="web.cat.speech"><i class="fa-solid fa-volume-high"></i><span data-k="web.cat.speech">语音</span></button>
			<button type="button" data-cat="time" data-title="历法" data-kt="web.cat.time"><i class="fa-solid fa-calendar-days"></i><span data-k="web.cat.time">历法</span></button>
			<button type="button" data-cat="image" data-title="图像" data-kt="web.cat.image"><i class="fa-solid fa-image"></i><span data-k="web.cat.image">图像</span></button>
			<button type="button" data-cat="talk" data-title="交流" data-kt="web.cat.talk"><i class="fa-solid fa-comments"></i><span data-k="web.cat.talk">交流</span></button>
		</nav>
		<a class="files" href="/files" target="_blank" rel="noopener"><i class="fa-solid fa-folder"></i><span data-k="web.files">文件传输</span></a>
		<label class="lang"><select id="lang"></select></label>
	</aside>
	<main>
		<button type="button" id="back" class="back" data-tool="home" hidden><i class="fa-solid fa-arrow-left"></i><span data-k="web.back">返回</span></button>
		<button type="button" id="tool-fav" class="back" hidden><i class="fa-solid fa-star"></i><span>收藏</span></button>
		<section id="home" class="panel on">
			<div class="head">
				<label class="find">
					<input id="tool-q" type="search" data-kph="web.find" placeholder="搜索工具" autocomplete="off"/>
				</label>
			</div>
			<div class="cards" id="cards">
				<button type="button" data-tool="ocr" data-cat="image" data-name="文字识别 ocr" title="Windows 系统 OCR 或 ONNX 模型包">
					<i class="fa-solid fa-eye"></i><span data-k="web.tool.ocr">文字识别</span>
					<i class="star fa-solid fa-star" data-fav="ocr" title="收藏"></i>
				</button>
				<button type="button" data-tool="tts" data-cat="speech" data-name="语音合成 朗读" title="Windows、SAPI、Edge 或离线模型">
					<i class="fa-solid fa-volume-high"></i><span data-k="web.tool.tts">语音合成</span>
					<i class="star fa-solid fa-star" data-fav="tts" title="收藏"></i>
				</button>
				<button type="button" data-tool="asr" data-cat="speech" data-name="语音识别 录音" title="系统识别器或离线模型，可录音或选文件">
					<i class="fa-solid fa-microphone"></i><span data-k="web.tool.asr">语音识别</span>
					<i class="star fa-solid fa-star" data-fav="asr" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-bit" data-cat="speech" data-name="8bit 合成器 方波 脉冲 三角波 锯齿 风琴 铃 贝斯 笛子 鼓 爆炸 警报 音效 乐器 编排 杂音" title="方波等乐器、四通道编排，以及爆炸、警报等音效">
					<i class="fa-solid fa-music"></i><span data-k="web.tool.bit">8bit合成器</span>
					<i class="star fa-solid fa-star" data-fav="u-bit" title="收藏"></i>
				</button>
				<button type="button" data-tool="qr" data-cat="image" data-name="二维码 条码 生成" title="生成 PNG，图下显示原文">
					<i class="fa-solid fa-qrcode"></i><span data-k="web.tool.qr">二维码生成</span>
					<i class="star fa-solid fa-star" data-fav="qr" title="收藏"></i>
				</button>
				<button type="button" data-tool="qrs" data-cat="image" data-name="二维码 条码 识别" title="从图片读出内容，可粘贴">
					<i class="fa-solid fa-barcode"></i><span data-k="web.tool.qrs">二维码识别</span>
					<i class="star fa-solid fa-star" data-fav="qrs" title="收藏"></i>
				</button>
				<button type="button" data-tool="text" data-cat="text" data-name="文本转换 base64 url json xml sql 十六进制 md5 sha256 html css js 转义 简繁转换 繁体 简体 日文注音 读音 假名 变量名 camel snake crontab cron token user-agent ua 解析" title="Base64、URL、十六进制、JSON、XML、SQL、哈希、HTML、CSS、JS、简繁、日文注音、变量名、Crontab、Token、User-Agent">
					<i class="fa-solid fa-file-lines"></i><span data-k="web.tool.text">文本转换</span>
					<i class="star fa-solid fa-star" data-fav="text" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-py" data-cat="text" data-name="中文转拼音 拼音 首字母 npinyin" title="把汉字转成拼音或拼音首字母">
					<i class="fa-solid fa-language"></i><span data-k="web.tool.pinyin">中文转拼音</span>
					<i class="star fa-solid fa-star" data-fav="u-py" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-pw" data-cat="text" data-name="随机密码 批量" title="本地生成，一次可出多条">
					<i class="fa-solid fa-key"></i><span data-k="web.tool.pw">随机密码</span>
					<i class="star fa-solid fa-star" data-fav="u-pw" title="收藏"></i>
				</button>
				<button type="button" data-tool="cal" data-cat="time" data-name="历法 农历 干支" title="公历换农历、干支、日本、希伯来等">
					<i class="fa-solid fa-calendar-days"></i><span data-k="web.tool.cal">历法</span>
					<i class="star fa-solid fa-star" data-fav="cal" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-ts" data-cat="time" data-name="时间戳 unix" title="秒或毫秒与本地时间互转">
					<i class="fa-solid fa-clock"></i><span data-k="web.tool.ts">时间戳</span>
					<i class="star fa-solid fa-star" data-fav="u-ts" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-re" data-cat="text" data-name="正则 表达式" title="在文字里查找匹配">
					<i class="fa-solid fa-asterisk"></i><span data-k="web.tool.re">正则测试</span>
					<i class="star fa-solid fa-star" data-fav="u-re" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-calc" data-cat="calc" data-name="计算器" title="加减乘除、括号和乘方">
					<i class="fa-solid fa-calculator"></i><span data-k="web.tool.calc">计算器</span>
					<i class="star fa-solid fa-star" data-fav="u-calc" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-radix" data-cat="calc" data-name="进制 二进制 十六进制" title="转换到默认全部，一次列出 2、8、10、16 进制">
					<i class="fa-solid fa-hashtag"></i><span data-k="web.tool.radix">进制转换</span>
					<i class="star fa-solid fa-star" data-fav="u-radix" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-unit" data-cat="calc" data-name="单位换算 长度 重量 货币 温度换算 面积 体积 存储 时间 压力 功率 px rem 米 英尺 摄氏 全部" title="数值可直接写 1米；新单位默认「全部」，一次列出该类型的全部单位。外币查中国银行中间价，失败时用 2026-10-10 的牌价并缓存 10 分钟">
					<i class="fa-solid fa-ruler"></i><span data-k="web.tool.unit">单位换算</span>
					<i class="star fa-solid fa-star" data-fav="u-unit" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-ctab" data-cat="image" data-name="颜色表 色表 web 颜色 C# 颜色 .NET 系统色 常用颜色 红 橙 黄 绿 青 蓝 紫" title="树形列出 web 命名色与 C# (.NET) 颜色，点一下复制十六进制">
					<i class="fa-solid fa-table-cells"></i><span data-k="web.tool.ctab">颜色表</span>
					<i class="star fa-solid fa-star" data-fav="u-ctab" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-b64img" data-cat="image" data-name="图片 base64" title="图片转成 Data URL">
					<i class="fa-solid fa-file-image"></i><span data-k="web.tool.b64">图片 Base64</span>
					<i class="star fa-solid fa-star" data-fav="u-b64img" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-ico" data-cat="image" data-name="图片 ico 图标" title="把图片做成 ICO，默认 32">
					<i class="fa-solid fa-icons"></i><span data-k="web.tool.ico">图片转 ICO</span>
					<i class="star fa-solid fa-star" data-fav="u-ico" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-datecalc" data-cat="time" data-name="日期计算 日期差 日期加减 月份加减 日期时间 天数 秒 分 小时 月 年" title="两个日期时间相差多少（单位可选，默认「全部」），或某个日期时间加减秒、分、小时、天、月、年（数量可为负，单位在数量后面）">
					<i class="fa-solid fa-calendar-days"></i><span data-k="web.tool.date">日期计算</span>
					<i class="star fa-solid fa-star" data-fav="u-datecalc" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-rmb" data-cat="calc" data-name="人民币 大写" title="数字转中文大写金额">
					<i class="fa-solid fa-yen-sign"></i><span data-k="web.tool.rmb">人民币大写</span>
					<i class="star fa-solid fa-star" data-fav="u-rmb" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-numread" data-cat="calc" data-name="数字表记 转换 中文读法 英文读法 韩语 韩文 固有 汉字 日语 德语 法语 西班牙语 葡萄牙语 俄语 小数 中数 大数 分厘毫 SI kilo mega 大写 罗马 千分位 科学计数" title="输入数字，列出中文、韩文、日语、德法西葡俄读法，以及小数中数大数和常用表记">
					<i class="fa-solid fa-font"></i><span data-k="web.tool.numread">数字表记转换</span>
					<i class="star fa-solid fa-star" data-fav="u-numread" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-rand" data-cat="calc" data-name="随机数" title="指定范围的随机数">
					<i class="fa-solid fa-dice"></i><span data-k="web.tool.rand">随机数</span>
					<i class="star fa-solid fa-star" data-fav="u-rand" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-sci" data-cat="calc" data-name="科学计算 三角函数" title="三角函数、对数和平方根">
					<i class="fa-solid fa-square-root-variable"></i><span data-k="web.tool.sci">科学计算</span>
					<i class="star fa-solid fa-star" data-fav="u-sci" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-plot" data-cat="calc" data-name="函数图像 函数 曲线 曲面 y=f(x) z=f(x,y) plot" title="输入公式画出函数图像，可平移和缩放">
					<i class="fa-solid fa-chart-line"></i><span data-k="web.tool.plot">函数图像</span>
					<i class="star fa-solid fa-star" data-fav="u-plot" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-pick" data-cat="image" data-name="取色 颜色选择" title="选一个颜色，给出各种写法">
					<i class="fa-solid fa-eye-dropper"></i><span data-k="web.tool.pick">取色</span>
					<i class="star fa-solid fa-star" data-fav="u-pick" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-bmi" data-cat="calc" data-name="bmi 体质" title="身高体重算 BMI">
					<i class="fa-solid fa-weight-scale"></i><span data-k="web.tool.bmi">BMI</span>
					<i class="star fa-solid fa-star" data-fav="u-bmi" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-loan" data-cat="calc" data-name="房贷 等额" title="等额本息或等额本金">
					<i class="fa-solid fa-house"></i><span data-k="web.tool.loan">房贷</span>
					<i class="star fa-solid fa-star" data-fav="u-loan" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-ascii" data-cat="text" data-name="unicode 码表 符号 ascii" title="按分组查看字符">
					<i class="fa-solid fa-table"></i><span data-k="web.tool.ascii">Unicode码表</span>
					<i class="star fa-solid fa-star" data-fav="u-ascii" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-asc" data-cat="text" data-name="ascii 码表 字符 控制字符 转义 0x41" title="按类别查看 0x00-0x7F，点一下选中并复制">
					<i class="fa-solid fa-table-list"></i><span data-k="web.tool.asc">ASCII码表</span>
					<i class="star fa-solid fa-star" data-fav="u-asc" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-gbk" data-cat="text" data-name="gbk 码表 国标" title="按首字节查看 GBK">
					<i class="fa-solid fa-font"></i><span data-k="web.tool.gbk">GBK码表</span>
					<i class="star fa-solid fa-star" data-fav="u-gbk" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-morse" data-cat="text" data-name="摩斯 摩尔斯 码表 morse 点划 电报 试听 播放 声音 文本" title="字母、数字、标点和信号的国际摩斯码，点一下复制试听，也可输入一段文字整段播放">
					<i class="fa-solid fa-ellipsis"></i><span data-k="web.tool.morse">摩斯码表</span>
					<i class="star fa-solid fa-star" data-fav="u-morse" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-watch" data-cat="time" data-name="计时 秒表 倒计时 截止" title="秒表、按秒倒计时，或到某个时间">
					<i class="fa-solid fa-stopwatch"></i><span data-k="web.tool.watch">计时</span>
					<i class="star fa-solid fa-star" data-fav="u-watch" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-work" data-cat="time" data-name="工作日" title="跳过周六和周日">
					<i class="fa-solid fa-briefcase"></i><span data-k="web.tool.work">工作日</span>
					<i class="star fa-solid fa-star" data-fav="u-work" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-grad" data-cat="image" data-name="css 渐变 线性 径向 锥形" title="线性、径向、锥形。可加多种颜色，用浏览器选色器，改完即预览">
					<i class="fa-solid fa-fill"></i><span data-k="web.tool.grad">CSS 渐变</span>
					<i class="star fa-solid fa-star" data-fav="u-grad" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-board" data-cat="image" data-name="画板 标注 矩形 椭圆 箭头 画笔 圈选 文字 粘贴 图片" title="画形状、文字，圈选笔迹后可移动，粘贴图片后可改大小">
					<i class="fa-solid fa-pen-ruler"></i><span data-k="web.tool.board">画板</span>
					<i class="star fa-solid fa-star" data-fav="u-board" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-html" data-cat="image" data-name="html 界面设计 工具 界面 按钮 卡片 表格 表单 预览" title="左边写 HTML，右边即时预览，可套用界面模板">
					<i class="fa-solid fa-code"></i><span data-k="web.tool.htmlui">HTML界面设计</span>
					<i class="star fa-solid fa-star" data-fav="u-html" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-ph" data-cat="image" data-name="占位图" title="改宽高、颜色或文字后马上预览，Ctrl+C 复制图片">
					<i class="fa-solid fa-image"></i><span data-k="web.tool.ph">占位图</span>
					<i class="star fa-solid fa-star" data-fav="u-ph" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-rcolor" data-cat="image" data-name="随机颜色" title="随机颜色列表，HEX、RGB、HSL、HSV、CMYK、YUV，点一个色值复制">
					<i class="fa-solid fa-fill-drip"></i><span data-k="web.tool.rcolor">随机颜色</span>
					<i class="star fa-solid fa-star" data-fav="u-rcolor" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-comp" data-cat="calc" data-name="复利" title="按年利率复利">
					<i class="fa-solid fa-percent"></i><span data-k="web.tool.comp">复利</span>
					<i class="star fa-solid fa-star" data-fav="u-comp" title="收藏"></i>
				</button>
				<button type="button" data-tool="chat" data-cat="talk" data-name="聊天室 昵称 性别 图片 文件" title="进入前填写昵称和性别，可以发文字、图片和文件">
					<i class="fa-solid fa-comments"></i><span data-k="web.tool.chat">聊天室</span>
					<i class="star fa-solid fa-star" data-fav="chat" title="收藏"></i>
				</button>
				<button type="button" data-tool="u-fake" data-cat="text" data-name="生成测试数据 测试数据 假数据 中文姓名 中文网名 英文网名 邮箱 手机 地址 公司 用户名 身份证 mac 地址 uuid bogus" title="按类型生成，一行一条。已安装 Bogus 时先选语言，再选该语言有的分类">
					<i class="fa-solid fa-user-group"></i><span data-k="web.tool.fake">生成测试数据</span>
					<i class="star fa-solid fa-star" data-fav="u-fake" title="收藏"></i>
				</button>

			</div>
			<p id="tool-none" class="none" hidden data-k="web.find.none">没有匹配的工具</p>
		</section>

		<section id="chat" class="panel">
			<h1>聊天室</h1>
			<div id="chat-gate">
				<div class="row">
					<label><span data-k="web.chat.nick">昵称</span>
						<input id="chat-nick" type="text" maxlength="16" autocomplete="nickname"/>
					</label>
					<label><span data-k="web.chat.gender">性别</span>
						<select id="chat-gender">
							<option value="" data-k="web.chat.secret">保密</option>
							<option value="m" data-k="web.chat.m">男</option>
							<option value="f" data-k="web.chat.f">女</option>
						</select>
					</label>
					<button type="button" id="chat-join" class="primary" data-k="web.chat.join">进入</button>
					<span id="chat-msg" class="msg"></span>
				</div>
			</div>
			<div id="chat-room" hidden>
				<div class="chatmain">
					<div id="chat-log"></div>
					<aside id="chat-peers"></aside>
				</div>
				<div id="chat-offers"></div>
				<div class="chatdock">
					<div class="row" id="chat-torow">
						<span class="chatlab" data-k="web.chat.to">发给</span>
						<select id="chat-to">
							<option value="" data-k="web.chat.all">所有人</option>
						</select>
						<label class="chatpriv"><input id="chat-priv" type="checkbox"/><span data-k="web.chat.priv">私密</span></label>
						<button type="button" id="chat-direct" class="ghost"><i class="fa-solid fa-file-export"></i><span data-k="web.chat.direct">直传</span></button>
					</div>
					<div class="row" id="chat-sendrow">
						<input id="chat-text" type="text" maxlength="500" data-kph="web.chat.ph" placeholder="说点什么"/>
						<button type="button" id="chat-send" class="primary"><i class="fa-solid fa-paper-plane"></i><span data-k="web.chat.send">发送</span></button>
						<button type="button" id="chat-imgbtn" class="ghost"><i class="fa-solid fa-image"></i><span data-k="web.chat.image">图片</span></button>
						<button type="button" id="chat-filebtn" class="ghost"><i class="fa-solid fa-paperclip"></i><span data-k="web.chat.file">文件</span></button>
						<button type="button" id="chat-leave" class="ghost"><i class="fa-solid fa-right-from-bracket"></i><span data-k="web.chat.leave">离开</span></button>
						<input id="chat-img" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden/>
						<input id="chat-file" type="file" hidden/>
						<input id="chat-directfile" type="file" hidden/>
					</div>
				</div>
			</div>
		</section>

		<section id="box" class="panel">
			<h1 id="box-title">工具</h1>
			<div id="box-body"></div>
			<div class="row">
				<button type="button" id="box-go" class="primary" data-k="web.go.calc">计算</button>
				<button type="button" id="box-copy" class="ghost" data-k="web.copy.out">复制结果</button>
				<span id="box-msg" class="msg"></span>
			</div>
			<label><span data-k="web.result">结果</span>
				<textarea id="box-out" rows="10" readonly></textarea>
				<div id="re-list" hidden></div>
				<ul id="rcolor-list" hidden></ul>
			</label>
		</section>

		<section id="cal" class="panel">
			<p class="kicker">Windows.Globalization.Calendar</p>
			<h1>历法</h1>
			<div class="row">
				<label><span data-k="web.f.greg">公历</span>
					<input id="cal-date" type="date"/>
				</label>
				<label><span data-k="web.cat.time">历法</span>
					<select id="cal-id">
						<option value="lunar">农历</option>
						<option value="gregorian">公历</option>
						<option value="jp">日本</option>
						<option value="jplunar">日本旧历</option>
						<option value="tw">民国</option>
						<option value="ko">韩国</option>
						<option value="vilunar">越南农历</option>
						<option value="he">希伯来</option>
						<option value="hijri">伊斯兰</option>
						<option value="umalqura">乌姆库拉</option>
						<option value="fa">波斯</option>
						<option value="th">佛历</option>
						<option value="julian">儒略历</option>
					</select>
				</label>
				<button type="button" id="cal-go" class="primary"><i class="fa-solid fa-calendar-check"></i><span data-k="web.go.unit">换算</span></button>
				<span id="cal-msg" class="msg"></span>
			</div>
			<dl id="cal-out" class="facts"></dl>
		</section>

		<section id="text" class="panel">
			<p class="kicker">文本</p>
			<h1>文本转换</h1>
			<div class="split txpair">
				<div>
					<div class="txhead"><span data-k="web.src">原文</span></div>
					<textarea id="tx-in" rows="14" data-kph="web.ph.src" placeholder="要处理的文字"></textarea>
				</div>
				<div>
					<div class="txhead">
						<span data-k="web.result">结果</span>
						<button type="button" id="tx-swap" class="ghost"><i class="fa-solid fa-right-left"></i><span data-k="web.swap">交换</span></button>
						<button type="button" id="tx-copy" class="ghost"><i class="fa-solid fa-copy"></i><span data-k="web.copy">复制</span></button>
						<span id="tx-msg" class="msg"></span>
					</div>
					<textarea id="tx-out" rows="14" readonly></textarea>
				</div>
			</div>
			<div class="ops" id="tx-ops">
				<div class="opgrp"><span>Base64</span><div>
					<button type="button" data-op="b64enc"><i class="fa-solid fa-lock"></i>编码</button>
					<button type="button" data-op="b64dec"><i class="fa-solid fa-lock-open"></i>解码</button>
				</div></div>
				<div class="opgrp"><span>URL</span><div>
					<button type="button" data-op="urlenc"><i class="fa-solid fa-link"></i>编码</button>
					<button type="button" data-op="urldec"><i class="fa-solid fa-link-slash"></i>解码</button>
				</div></div>
				<div class="opgrp"><span>十六进制</span><div>
					<button type="button" data-op="utf8hex"><i class="fa-solid fa-hashtag"></i>UTF-8</button>
					<button type="button" data-op="utf8unhex"><i class="fa-solid fa-rotate-left"></i>还原 UTF-8</button>
					<button type="button" data-op="gbkhex"><i class="fa-solid fa-hashtag"></i>GBK</button>
					<button type="button" data-op="gbkunhex"><i class="fa-solid fa-rotate-left"></i>还原 GBK</button>
				</div></div>
				<div class="opgrp"><span>Unicode</span><div>
					<button type="button" data-op="uesc"><i class="fa-solid fa-code"></i>转义</button>
					<button type="button" data-op="uunesc"><i class="fa-solid fa-rotate-left"></i>还原</button>
				</div></div>
				<div class="opgrp"><span>大小写</span><div>
					<button type="button" data-op="upper"><i class="fa-solid fa-arrow-up-a-z"></i><span data-k="web.pw.up">大写</span></button>
					<button type="button" data-op="lower"><i class="fa-solid fa-arrow-down-a-z"></i><span data-k="web.pw.low">小写</span></button>
				</div></div>
				<div class="opgrp"><span>简繁转换</span><div>
					<button type="button" data-op="trad"><i class="fa-solid fa-language"></i>转为繁体</button>
					<button type="button" data-op="simp"><i class="fa-solid fa-language"></i>转为简体</button>
				</div></div>
				<div class="opgrp"><span>日文注音</span><div>
					<button type="button" data-op="yomi"><i class="fa-solid fa-comment"></i>非逐字</button>
					<button type="button" data-op="yomimono"><i class="fa-solid fa-comment"></i>逐字</button>
				</div></div>
				<div class="opgrp"><span>JSON</span><div>
					<button type="button" data-op="json"><i class="fa-solid fa-code"></i>美化</button>
					<button type="button" data-op="jsonmin"><i class="fa-solid fa-compress"></i>压缩</button>
					<button type="button" data-op="jesc"><i class="fa-solid fa-code"></i>转义</button>
					<button type="button" data-op="juesc"><i class="fa-solid fa-rotate-left"></i>还原</button>
				</div></div>
				<div class="opgrp"><span>XML</span><div>
					<button type="button" data-op="xml"><i class="fa-solid fa-code"></i>格式化</button>
					<button type="button" data-op="xmlmin"><i class="fa-solid fa-compress"></i>压缩</button>
				</div></div>
				<div class="opgrp"><span>SQL</span><div>
					<button type="button" data-op="sql"><i class="fa-solid fa-database"></i>格式化</button>
					<button type="button" data-op="sqlmin"><i class="fa-solid fa-compress"></i>压缩</button>
				</div></div>
				<div class="opgrp"><span>HTML</span><div>
					<button type="button" data-op="htmlenc"><i class="fa-solid fa-code"></i>编码</button>
					<button type="button" data-op="htmldec"><i class="fa-solid fa-rotate-left"></i>解码</button>
					<button type="button" data-op="hmin"><i class="fa-solid fa-file-code"></i>压缩</button>
					<button type="button" data-op="hjs"><i class="fa-solid fa-quote-left"></i>转 JS</button>
				</div></div>
				<div class="opgrp"><span>代码</span><div>
					<button type="button" data-op="cmin"><i class="fa-solid fa-brush"></i>CSS 压缩</button>
					<button type="button" data-op="jsmin"><i class="fa-solid fa-file-code"></i>JS 压缩</button>
				</div></div>
				<div class="opgrp"><span>哈希</span><div>
					<button type="button" data-op="md5"><i class="fa-solid fa-lock"></i>MD5</button>
					<button type="button" data-op="sha"><i class="fa-solid fa-lock"></i>SHA-256</button>
				</div></div>
				<div class="opgrp"><span>其它</span><div>
					<button type="button" data-op="name"><i class="fa-solid fa-signature"></i>变量名转换</button>
					<button type="button" data-op="cron"><i class="fa-solid fa-clock"></i>Crontab解析</button>
					<button type="button" data-op="ua"><i class="fa-solid fa-user"></i>User-Agent解析</button>
					<button type="button" data-op="stats"><i class="fa-solid fa-chart-column"></i>字符统计</button>
					<button type="button" data-op="tok"><i class="fa-solid fa-hashtag"></i>token统计</button>
					<button type="button" data-op="collapse"><i class="fa-solid fa-compress"></i>合并空白</button>
					<button type="button" data-op="dropempty"><i class="fa-solid fa-eraser"></i>去掉空行</button>
				</div></div>
			</div>
		</section>

		<section id="ocr" class="panel">
			<p class="kicker">OCR</p>
			<h1>文字识别</h1>
			<div class="row">
				<label><span data-k="web.f.eng">引擎</span>
					<select id="ocr-pack"></select>
				</label>
				<label id="ocr-model-lab"><span data-k="web.f.packlang">语言 / 模型</span>
					<select id="ocr-model"></select>
				</label>
				<label id="ocr-dev-lab"><span data-k="web.f.dev">设备</span>
					<select id="ocr-dev">
						<option value="cpu">CPU</option>
						<option value="gpu">GPU (CUDA)</option>
						<option value="intel">核显 (DirectML)</option>
					</select>
				</label>
			</div>
			<div class="row">
				<label><span data-k="web.f.img">图片</span>
					<input id="ocr-file" type="file" accept="image/*"/>
				</label>
				<button type="button" id="ocr-go" class="primary"><i class="fa-solid fa-eye"></i><span data-k="web.f.scan">识别</span></button>
				<button type="button" id="ocr-copy" class="ghost"><i class="fa-solid fa-copy"></i><span data-k="web.copy.out">复制结果</span></button>
				<span id="ocr-msg" class="msg"></span>
			</div>
			<p class="hint" data-k="web.f.paste">在此页按 Ctrl+V 可粘贴剪贴板里的图片。</p>
			<img id="ocr-img" alt="预览" hidden/>
			<p id="ocr-meta" class="ocr-meta" hidden></p>
			<label><span data-k="web.result">结果</span>
				<textarea id="ocr-out" rows="8" readonly></textarea>
			</label>
		</section>

		<section id="tts" class="panel">
			<p class="kicker">TTS</p>
			<h1>语音合成</h1>
			<div class="row">
				<label><span data-k="web.f.eng">引擎</span>
					<select id="tts-eng"></select>
				</label>
				<label><span data-k="web.f.lang">语言</span>
					<select id="tts-lang"></select>
				</label>
				<label><span data-k="web.f.gender">性别</span>
					<select id="tts-gender">
						<option value="">全部性别</option>
						<option value="female">女声</option>
						<option value="male">男声</option>
					</select>
				</label>
				<label><span data-k="web.f.model">模型</span>
					<select id="tts-model"></select>
				</label>
				<label><span data-k="web.f.voice">发音人</span>
					<select id="tts-voice"></select>
				</label>
				<label><span data-k="web.f.speed">语速</span>
					<input id="tts-speed" type="number" min="0.5" max="2" step="0.1" value="1"/>
				</label>
			</div>
			<label><span data-k="web.src">原文</span>
				<textarea id="tts-in" rows="6" data-kph="web.ph.speak" placeholder="要朗读的文字"></textarea>
			</label>
			<div class="row">
				<button type="button" id="tts-go" class="primary"><i class="fa-solid fa-volume-high"></i><span data-k="web.f.speak">朗读</span></button>
				<button type="button" id="tts-wav"><i class="fa-solid fa-file-audio"></i><span data-k="web.f.wav">生成 WAV</span></button>
				<span id="tts-msg" class="msg"></span>
			</div>
			<audio id="tts-audio" controls hidden></audio>
		</section>

		<section id="asr" class="panel">
			<p class="kicker">ASR</p>
			<h1>语音识别</h1>
			<div class="row">
				<label><span data-k="web.f.eng">引擎</span>
					<select id="asr-eng">
						<option value="offline">离线模型</option>
						<option value="windows">Windows 语音识别</option>
					</select>
				</label>
				<label><span data-k="web.f.model">模型</span>
					<select id="asr-model"></select>
				</label>
				<label><span data-k="web.f.lang">语言</span>
					<select id="asr-lang">
						<option value="auto">自动</option>
						<option value="zh">中文</option>
						<option value="en">英文</option>
						<option value="ja">日文</option>
						<option value="ko">韩文</option>
						<option value="yue">粤语</option>
					</select>
				</label>
			</div>
			<div class="row">
				<label><span data-k="web.f.audio">音频文件</span>
					<input id="asr-file" type="file" accept="audio/*,video/webm"/>
				</label>
				<button type="button" id="asr-filego" class="primary"><i class="fa-solid fa-file-audio"></i><span data-k="web.f.scanfile">识别文件</span></button>
				<button type="button" id="asr-rec"><i class="fa-solid fa-microphone"></i><span data-k="web.f.rec">录音</span></button>
				<button type="button" id="asr-copy" class="ghost"><i class="fa-solid fa-copy"></i><span data-k="web.copy.out">复制结果</span></button>
				<span id="asr-msg" class="msg"></span>
			</div>
			<label><span data-k="web.result">结果</span>
				<textarea id="asr-out" rows="8" readonly></textarea>
			</label>
		</section>

		<section id="qr" class="panel">
			<p class="kicker">ZXing</p>
			<h1>二维码生成</h1>
			<div class="row">
				<label><span data-k="web.f.kind">类型</span>
					<select id="qr-fmt">
						<option value="qr">QR Code</option>
						<option value="datamatrix">Data Matrix</option>
						<option value="code128">Code 128</option>
						<option value="code39">Code 39</option>
						<option value="ean13">EAN-13</option>
						<option value="ean8">EAN-8</option>
						<option value="upca">UPC-A</option>
					</select>
				</label>
				<label><span data-k="web.f.enc">编码</span>
					<select id="qr-enc">
						<option value="utf8">UTF-8</option>
						<option value="gbk">GBK</option>
						<option value="hex">Hex</option>
					</select>
				</label>
			</div>
			<label><span data-k="web.f.content">内容</span>
				<textarea id="qr-in" rows="4" data-kph="web.ph.qr" placeholder="要写进码里的文字"></textarea>
			</label>
			<div class="row">
				<button type="button" id="qr-make" class="primary"><i class="fa-solid fa-qrcode"></i><span data-k="web.go.gen">生成</span></button>
				<label class="check"><input id="qr-capon" type="checkbox" checked/>带文字</label>
				<span id="qr-msg" class="msg"></span>
			</div>
			<div class="qrbox">
				<img id="qr-img" alt="" hidden/>
				<p id="qr-cap" class="qrcap" hidden></p>
			</div>
		</section>

		<section id="qrs" class="panel">
			<p class="kicker">ZXing</p>
			<h1>二维码识别</h1>
			<div class="row">
				<label><span data-k="web.f.img">图片</span>
					<input id="qrs-file" type="file" accept="image/*"/>
				</label>
				<button type="button" id="qr-scan" class="primary"><i class="fa-solid fa-barcode"></i><span data-k="web.f.scan">识别</span></button>
				<span id="qrs-msg" class="msg"></span>
			</div>
			<p class="hint" data-k="web.f.paste">在此页按 Ctrl+V 可粘贴剪贴板里的图片。</p>
			<img id="qrs-img" alt="预览" hidden/>
			<label><span data-k="web.result">结果</span>
				<textarea id="qrs-out" rows="6" readonly></textarea>
			</label>
		</section>
	</main>
</div>
