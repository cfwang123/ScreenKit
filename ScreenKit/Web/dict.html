<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>词典</title>
<link rel="stylesheet" href="/sk/fa.css?__SK_WEB_VER__"/>
<link rel="stylesheet" href="/sk/dict.css?__SK_WEB_VER__"/>
<script>window.SKL="__SK_UI_LANG__";</script>
</head>
<body>
<header class="top">
	<a class="logo" href="/" title="返回首页" data-ktip="web.home"><span class="mark">S</span></a>
	<strong data-k="dict.title">词典</strong>
	<label class="lang"><span data-k="web.f.lang">语言</span><select id="lang"></select></label>
</header>
<div class="bar">
	<input id="q" type="search" autocomplete="off" spellcheck="false"/>
	<div class="filts" id="filts">
		<button type="button" data-dict="" class="on" data-k="dict.filter.all">全部</button>
		<button type="button" data-dict="zh" data-k="dict.filter.zh">汉语</button>
		<button type="button" data-dict="ja" data-k="dict.filter.ja">日语</button>
		<button type="button" data-dict="ko" data-k="dict.filter.ko">韩语</button>
		<button type="button" data-dict="en" data-k="dict.filter.en">英语</button>
	</div>
	<button type="button" id="speak" data-k="dict.speak" data-ktip="dict.speak.tip" title="按参数里该语言的引擎和发音人读词头（汉 / 英 / 日 / 韩）">发音</button>
	<select id="fmt" aria-label="fmt">
		<option value="txt">txt</option>
		<option value="csv">csv</option>
		<option value="html">html</option>
		<option value="md">md</option>
	</select>
	<button type="button" id="export" data-k="dict.export" data-ktip="dict.export.tip" title="把这次搜索的全部词条详情导出。不受结果条数限制。txt 为纯文本接在一起。html 和 md 是表格，列为单词和详情。另有 csv。">导出</button>
</div>
<div class="split">
	<ul id="hits"></ul>
	<div id="detail"></div>
</div>
<p id="status"></p>
<div id="pop" hidden>
	<p id="pop-wait" data-k="dict.sel.searching">搜索中…</p>
	<ul id="pop-hits"></ul>
	<div class="pop-ops">
		<button type="button" id="pop-speak" data-k="dict.speak">发音</button>
		<button type="button" id="pop-search" data-k="dict.sel.search">搜索</button>
		<button type="button" id="pop-tr" data-k="dict.sel.translate">翻译</button>
		<button type="button" id="pop-copy" data-k="dict.sel.copy">复制</button>
	</div>
</div>
<script src="/sk/L.js?__SK_WEB_VER__"></script>
<script src="/sk/dict.js?__SK_WEB_VER__"></script>
</body>
</html>
