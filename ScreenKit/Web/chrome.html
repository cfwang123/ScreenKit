<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chrome模型</title>
<link rel="stylesheet" href="/sk/chrome.css?__SK_WEB_VER__"/>
</head>
<body>
<header>
	<h1>Chrome模型</h1>
</header>
<div class="bar">
	<select id="lang">
		<option value="">全部语言</option>
	</select>
	<select id="kind">
		<option value="all">全部</option>
		<option value="on">已安装</option>
		<option value="tr">翻译</option>
		<option value="tts">语音</option>
	</select>
	<button type="button" id="refresh">刷新</button>
	<button type="button" id="install">安装所选</button>
	<button type="button" id="remove">卸载所选</button>
	<span id="msg"></span>
</div>
<p class="hint">翻译模型按本机文件显示是否已安装。语音包按安装记录显示。当前 Chrome 里已有的离线 Google 语音也算已安装。Windows 自带语音不算。</p>
<div class="scroll">
	<table id="tab"></table>
</div>
<script src="/sk/chrome.js?__SK_WEB_VER__"></script>
</body>
</html>
