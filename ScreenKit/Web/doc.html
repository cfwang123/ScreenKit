<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>文档阅读器</title>
<link rel="stylesheet" href="/sk/doc.css?__SK_WEB_VER__"/>
<link rel="stylesheet" href="/sk/viewer.min.css?__SK_WEB_VER__"/>
</head>
<body>
<div class="doc-tabs" id="tabs" hidden></div>
<div class="doc-stage" id="stage">
	<div class="doc-drop" id="drop" hidden>
		<div class="doc-drop-card">
			<strong data-k="web.mdread.droptitle">松开即可加入</strong>
			<span data-k="web.mdread.hint">把 Markdown、Word(.docx) 或 PDF 拖到这里，可一次拖多个</span>
		</div>
	</div>
	<div class="doc-empty" id="empty" data-k="web.mdread.hint">把 Markdown、Word(.docx) 或 PDF 拖到这里，可一次拖多个</div>
	<iframe id="view" title="preview" sandbox="allow-popups allow-scripts allow-same-origin"></iframe>
</div>
<div class="doc-tip" id="tip"></div>
<input id="file" type="file" multiple accept=".md,.markdown,.mdown,.mkd,.docx,.pdf" hidden/>
<script>window.SKL="__SK_UI_LANG__";</script>
<script src="/sk/L.js?__SK_WEB_VER__"></script>
<script src="/sk/viewer.min.js?__SK_WEB_VER__"></script>
<script src="/sk/doc.js?__SK_WEB_VER__"></script>
</body>
</html>
