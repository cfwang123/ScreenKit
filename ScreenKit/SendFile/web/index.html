<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ScreenKit 文件</title>
<link rel="stylesheet" href="/web/d.css?__SK_WEB_VER__"/>
</head>
<body>
<div id="login" class="card login">
	<h1 id="ltitle">文件管理</h1>
	<p id="lhint" class="muted">登录后可上传、新建、删除。下载只需正确链接。</p>
	<input id="epass" type="password" autocomplete="current-password"/>
	<label class="keep"><input id="ekeep" type="checkbox"/> <span id="lkeep">保持登录</span></label>
	<button id="blogin" type="button">登录</button>
	<p id="lerr" class="err" hidden></p>
	<p class="langline">
		<button type="button" class="langbtn" data-lang="zh">中文</button>
		<button type="button" class="langbtn" data-lang="en">EN</button>
	</p>
	<p class="switch"><a id="lpc" href="/m">手机版</a></p>
</div>
<div id="main" hidden>
	<header>
		<div class="brand">
			<strong id="btitle">文件管理</strong>
			<span id="bname" class="muted"></span>
		</div>
		<nav id="crumbs" class="crumbs"></nav>
		<div class="tools">
			<button id="bup" type="button">上传</button>
			<button id="bmkdir" type="button">新建文件夹</button>
			<button id="bref" type="button">刷新</button>
			<button id="btext" type="button">文本传输</button>
			<button id="bzip" type="button">打包下载</button>
			<button id="bdel" type="button" class="danger" hidden>删除所选</button>
			<button id="bout" type="button" class="ghost">退出</button>
			<span class="langline">
				<button type="button" class="langbtn" data-lang="zh">中文</button>
				<button type="button" class="langbtn" data-lang="en">EN</button>
			</span>
		</div>
	</header>
	<p id="err" class="err" hidden></p>
	<p id="empty" class="muted empty" hidden></p>
	<div class="tablewrap">
		<table>
			<thead>
				<tr>
					<th class="c0"><input id="eall" type="checkbox"/></th>
					<th id="hname">名称</th>
					<th id="hsize">大小</th>
					<th id="htime">修改时间</th>
					<th id="hact">操作</th>
				</tr>
			</thead>
			<tbody id="rows"></tbody>
		</table>
	</div>
</div>
<input id="efile" type="file" multiple hidden/>
<div id="textdlg" class="modal" hidden>
	<div class="modalcard" role="dialog" aria-modal="true" aria-labelledby="texttitle">
		<h3 id="texttitle">文本传输</h3>
		<p id="texthint" class="muted">电脑文件同步页里的当前文本。可修改后推送回去。</p>
		<textarea id="etext"></textarea>
		<p id="texterr" class="err" hidden></p>
		<p id="textstat" class="muted"></p>
		<div class="modalacts">
			<button id="btextclear" type="button">清空</button>
			<button id="btextclose" type="button" class="ghost">关闭</button>
			<button id="btextpush" type="button" class="primary">推送到PC</button>
		</div>
	</div>
</div>
<script src="/web/app.js?__SK_WEB_VER__"></script>
<script>window.sfweb.init({mobile:false});</script>
</body>
</html>
