http.doc.status = "查看服务是否在听，以及 OCR、语音、翻译、对话、人脸等模块是否开启。\n仅 GET。无参数。\n响应含 http_enabled、http_ocr、ocr_engine、asr_models、llm_chat 等。"
http.doc.toast = "在主显示器底部显示一条 Toast，不抢焦点。其它模块关掉时仍可用。\ntext 或 message：要显示的文字。\nms：显示毫秒，默认 1900，限制在 800～8000。\nGET 用查询参数，POST 用 JSON。文字为空返回 802。"
http.doc.zhconv = "用系统字表做简体/繁体转换。繁体按台湾 zh-TW，逐字映射。\ntext 或 message：原文。\nto：trad 转为繁体（默认），simp 转为简体。\n响应 data.text 是结果，data.to 是方向。"
http.doc.pinyin = "Chinês para pinyin. Sem text, data.installed diz se a DLL está presente.\ntext: origem. data.pinyin é o pinyin separado e data.py uma inicial minúscula por caractere.\n803 se a DLL faltar."
http.doc.md = "Converte Markdown numa página.\ntext: origem.\nbase64: bytes do ficheiro; UTF-8 e GBK.\ntitle: opcional.\nDevolve data.html."
http.doc.calendar = "把公历换成 Windows 历法。农历含干支、正月/闰月和初几。日期按本地中午换算。\ndate：yyyy-MM-dd，省略为今天。\ncal：lunar（默认）、gregorian、jp、jplunar、tw、ko、vilunar、he、hijri、umalqura、fa、th、julian。\n响应含 ganzhi、month、day、week、leap、gregorian。"
http.doc.jpyomi = "把日文句子转成读音。需要本机日语语言支持。没有同等的汉语拼音接口。\ntext 或 message：日文。\nmono：true 逐字注音，默认按词组。\n响应 ruby 是原文夹读音，yomi 是读音。"
http.doc.fake = "生成测试数据。不带 kind 时返回 data.installed。已安装时还有 data.langs（每种语言和它可选的分类）与 data.kinds（分类 id 和文案 key）。\n已安装时传 locale、kind、n（1 到 50）。locale 例如 zh_CN、en、ja。kind 必须是该语言列出的分类。data.text 一行一条。\n不传 locale 时默认 zh_CN；enname、ennick 仍走 en。未安装时生成失败，工具页用内置数据。"
http.doc.text = "文本编解码。其它模块关掉时仍可用。\ntext 或 message：原文，可以为空。\nop：b64enc、b64dec、urlenc、urldec、utf8hex、utf8unhex、gbkhex、gbkunhex、uesc、uunesc、upper、lower、collapse、dropempty、json、stats。\n响应 data.text 是结果。未知 op 返回 802。"
http.doc.fx = "货币换算。其它模块关掉时仍可用。\namount：数值。\nfrom：原单位，如 USD、CNY。\nto：新单位，或 all（默认，列出全部）。\n向中国银行网站查中间价。成功或失败都缓存 10 分钟。查询失败时用 2026-10-10 的牌价。\ndata.text 是结果。data.live 为 false 表示用了默认牌价。"
