http.doc.ipcity = "IP city lookup. Still available when other modules are off.\nip: an IP or a domain. Empty looks up this PC.\nUses the app HTTP proxy. Tries ip-api.com, then ipinfo.io, then api.ip.sb.\nA private or invalid address returns 802.\ndata has ip, country, region, city, isp, and text. lat and lon are included when a point was returned."
http.doc.mac = "MAC vendor lookup. Still available when other modules are off.\nmac: a MAC address or prefix. Colons, dashes, dots, or plain hex.\nUses the app HTTP proxy. Tries macaddresslookup.app, then api.macvendors.com, then macverify.com.\nA locally administered address has no IEEE registrant and returns 802 without a network call.\ndata has mac, company, country, address, block, local, multicast, and text."
http.doc.usb = "USB ID lookup. Still available when other modules are off.\nvid: four hex digits. pid is optional.\nid can be vid, vid:pid, 0xvid, or VID_xxxx&PID_xxxx.\nThe list is the public usb.ids file. It is cached in tmp for 7 days.\nReturns the vendor, product, model, and interfaces recorded for that ID.\nAn unknown vendor returns 802. An unknown product still returns the vendor.\ndata has vid, pid, vendor, product, model, interfaces, and text."
http.doc.enc = "把一个码位转成 GBK、GB18030、Big5、Shift_JIS、EUC-KR、Latin-1 的字节，空格分隔的十六进制。其它模块关掉时仍可用。\ncp：十进制、0x 或 U+。也可以用 text 或 ch 传一个字符。\n放不下的编码是空字符串。U+0100 及以上没有 Latin-1。码位非法返回 802。"
http.doc.fonts = "列出本机已安装的字体，按当前界面语言排序。名字以 @ 开头的竖排字体不列入。结果缓存 10 分钟。Unicode、ASCII、GBK 码表用这个列表选字体。"
http.doc.qrmake = "生成二维码或条码，返回 PNG。其它模块关掉时仍可用。\ntext 或 message：内容。\nformat：qr（默认）、datamatrix、code128、code39、ean13、ean8、upca。\nencoding：utf8（默认）、gbk、hex。一维码按字符写入，不用 gbk。\n响应 data.png 是 Base64。空内容或写码失败返回 802 / 500。"
http.doc.qrscan = "从图片识别二维码和条码。其它模块关掉时仍可用。不跑 OCR。\nbase64 或 path：图片。也可用 multipart。\nformat：dict 带坐标（默认）或 text。\n响应每项含 format、type、text、box。二维码的 format 是 QRCode。没有码时 code 为 101。"
http.doc.caststop = "立刻关闭投屏画面窗并断开当前接收。\n无参数。GET 或 POST 都可以。"
http.doc.api = "列出当前仍开启的接口。关掉的模块不会出现。\n仅 GET。\nlang：说明文字的语言，如 zh、en、ja、ko。省略时用程序当前界面语言。\n响应里 endpoints 是简表。apis 每一项有 method、path、summary、params。params 的文字与 HTTP 接口页相同。"
http.doc.ocrmodels = "列出和主窗口一样的识别引擎和模型。\n仅 GET。无参数。"
http.doc.ocropt = "返回 OCR 参数说明。每项有 title、toolTip、default。\n仅 GET。无参数。实际识别用 POST /api/ocr 的 options。"
http.doc.ocr = "识别图片中的文字。Windows 系统 OCR 不加载 OpenCV；ONNX 需要模型。\nbase64：图片。也可用 multipart 的 file 或 image。\noptions：没写的项用主窗当前设置。\noptions.data.format：dict 带坐标，text 为纯文本。\noptions.ocr.engine：空=跟主窗，winocr=系统 OCR，onnx=ONNX。\noptions.ocr.language：模型变体或系统 OCR 语言。\noptions.ocr.device：cpu / gpu / intel。\noptions.ocr.barcode：true 时同时扫条码。"
http.doc.qr = "只识别条码和二维码，不跑 OCR。需要 ZXing.dll。\nPOST /api/qrcode 与 Umi-OCR 相同，/api/barcode、/api/barcodes 也是这个接口。\nbase64 或 path：图片。也可用 multipart。\nformat：dict 带坐标（默认）或 text。\n响应每项含 format、type、text、box。二维码的 format 是 QRCode。"
http.doc.asrmodels = "列出可用的语音识别模型，含 Sherpa 和已安装的 Windows 识别器。\n仅 GET。无参数。\n每项含 name、type、streaming、sample_rate、culture。"
http.doc.asr = "识别一段音频。Windows 识别器只走 CPU。\nbase64 或 path：音频。path 是本机绝对路径。\nmodel 或 asr_model：显示名，省略用当前离线模型。\nlang：默认 auto。\nitn：模型逆文本归一化，默认 true。\npostprocess：规则后处理，默认 true。\ndevice 或 compute：auto / gpu / cpu / igpu。Windows 识别器忽略此项。"
http.doc.ttsengines = "只列出语音合成引擎，不扫描模型和发音人。\n仅 GET。无参数。\nengine：sherpa、sapi、winrt、edge。name 是显示名。"
http.doc.ttsmodels = "列出语音合成模型和发音人，含 Sherpa、SAPI、Windows 和 Edge。\n仅 GET。桌面程序打开时，直接返回语音合成页已经加载的列表，含全部发音人。\n没有这份列表时，不带参数会扫描全部并记住这次结果；下次同样的全量查询直接返回缓存。\nengine：只返回这一引擎的模型。sherpa、sapi、winrt（或 windows）、edge。\nrefresh：1 或 true 时忽略缓存，重新扫描。全量扫描会更新缓存。\n响应 cached 表示这次是否用了已有结果。"
http.doc.tts = "把文字合成 WAV，响应里是 wav_base64。最长 20000 字。\ntext：要读的文字。\nengine：sherpa / sapi / winrt / edge。空则自动选择。\nmodel：Sherpa 显示名，或 SAPI / Windows / Edge Online。\nvoice：发音人，如 sapi:…、winrt:…、edge:…。\nspeaker_id：发音人序号，默认 0。\nspeed：0.5～2，默认 1。volume：0～100，默认 100。\ndevice：仅 Sherpa，auto / gpu / cpu / igpu。"
http.doc.tts.sapi = "用本机 SAPI 发音人合成。\ntext：要读的文字。\nengine：sapi。\nvoice：可选，sapi: 开头的发音人。省略用默认。\nspeed、volume 与 /api/tts 相同。"
http.doc.tts.win = "用 Windows 语音合成。本机没有发音人时不会出声。\ntext：要读的文字。\nengine：winrt。\nvoice：可选，winrt: 开头的发音人。"
http.doc.tts.edge = "用 Edge 在线语音合成，需要能访问网络。\ntext：要读的文字。\nengine：edge。\nvoice：edge: 开头的发音人，例如 edge:ko-KR-SunHiNeural。"
http.doc.ttsdevices = "列出正在使用的播放设备。\n仅 GET。无参数。\nid 是设备编号，name 是名称，index 是序号，default 为 true 的是默认设备。"
http.doc.ttsspeak = "合成后直接在本机播放，不返回音频。合成参数与 /api/tts 相同。\ntext：要读的文字。\ndevices：播放设备，可多个。填 /api/tts/devices 的 id、名称或 index。省略则用默认设备。\nplay：queue 排队，now 立刻打断当前并播放。默认 queue。\ndevice 仍是 Sherpa 的计算设备，不是喇叭。"
http.doc.itn = "把口语数字等还原成书面形式（WeText 加规则）。跟随 ASR 模块开关。\ntext：待处理文字，例如「二零二四年一月一日」。"
http.doc.translate = "用已配置的翻译 LLM 批量翻译。没配置 LLM 时改用已安装的本地模型。\\nitems：字符串数组。\\nsrc：源语言，如 zh。\\ndst：目标语言，如 en。\\nGET /api/translate/langs 列出可选语言。"
http.doc.chat = "和已配置的对话 LLM 交谈。\ntext：用户问题。也可以传音频做语音输入。\ntts：true 时把回答再合成语音，响应含 wav_base64。\nagent：true 时启用搜索和本地文件工具。\nengine：朗读回答时的语音引擎，如 sapi。"
http.doc.chat.tts = "对话后立刻朗读回答。\ntext：用户问题。\ntts：true。\nengine：朗读引擎，示例为 sapi。\n响应含回答文字和 wav_base64。"
http.doc.facemodels = "列出人脸检测和识别用的 ONNX。\n仅 GET。无参数。"
http.doc.face = "人脸检测、提特征，或两张图比对。需要已安装的人脸模型。\nbase64 或 path：一张图。\nbase64_b：第二张图，用来比对。"
