fc.title = "Быстрое копирование"
fc.hint = "Копирует, переносит или делает ссылки на файлы и папки. На том же диске предпочтительно переименование. Жёсткая ссылка остаётся на том же томе. Регистрация добавляет вырезание, копирование, удаление, символическую ссылку, жёсткую ссылку, размер, пути и параметры. Уже зарегистрированное меню переписывается при запуске. После смены языка зарегистрируйте снова. В Windows 11 пункт в «Показать дополнительные параметры». Окно также может удалить навсегда или переместить в корзину и спрашивает подтверждение перед началом. Перетаскивание в список добавляет источники. Перетаскивание на цель задаёт эту папку; для файла берётся родительская папка."
