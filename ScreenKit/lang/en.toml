web.everb.hint = "Enter a verb, adjective or noun. Auto checks the irregular verb, adjective and noun tables, then the ending; if unsure it treats the word as a verb, and you can change the type. Verbs list the basic forms, sixteen tenses, negatives, questions, passive, modals, subjunctive, imperative, tag questions, causative and regional variants. Adjectives list comparative and superlative forms, comparison patterns, the adverb and the noun. Nouns list plural, articles, possessives and subject-verb agreement. Slashes separate variants; the tables use the first.Each type also lists register and tone patterns such as formal, neutral, informal, emphatic, hedged, exclamation and deduction.Every tone also has a negative counterpart: modals list can't, mustn't, don't have to and so on, and register, deduction and hearsay tones have negative versions such as it is said not to walk and isn't it beautiful."
