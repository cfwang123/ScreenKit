http.doc.status = "Whether the server is listening, and whether OCR, speech, translate, chat, and face are on.\nGET only. No parameters.\nThe response includes http_enabled, http_ocr, ocr_engine, asr_models, llm_chat, and similar fields."
http.doc.toast = "Shows a toast at the bottom of the primary monitor. It does not take focus. Stays available when other modules are off.\ntext or message: the words to show.\nms: milliseconds, default 1900, clamped to 800–8000.\nGET uses the query string. POST uses JSON. An empty text returns 802."
http.doc.zhconv = "Simplified/traditional conversion with the system table. Traditional follows Taiwan zh-TW, character by character.\ntext or message: source text.\nto: trad (default) or simp.\ndata.text is the result. data.to is the direction."
http.doc.pinyin = "Chinese to pinyin. With no text, data.installed says whether NPinyin.dll is present.\ntext: source. data.pinyin is spaced pinyin and data.py is one lowercase initial per character.\n803 when the DLL is missing."
http.doc.md = "Renders Markdown as a page.\ntext: source.\nbase64: file bytes; UTF-8 and GBK, same as the desktop reader.\ntitle: optional.\nReturns data.html."
http.doc.calendar = "Converts a Gregorian date with Windows calendars. Chinese lunar includes the sexagenary year and leap month. The date is taken at local noon.\ndate: yyyy-MM-dd. Omitted means today.\ncal: lunar (default), gregorian, jp, jplunar, tw, ko, vilunar, he, hijri, umalqura, fa, th, julian.\nThe response includes ganzhi, month, day, week, leap, and gregorian."
http.doc.jpyomi = "Turns a Japanese sentence into readings. The Japanese language feature must be installed. Windows has no matching Chinese pinyin API.\ntext or message: Japanese.\nmono: true reads character by character. The default is by word.\nruby mixes the text with readings. yomi is the reading only."
http.doc.fake = "Generate test data. Without kind, data.installed says whether Bogus.dll is installed.\nWhen it is installed, data.langs lists each language and the categories that language has, and data.kinds lists category ids and label keys.\nPass locale, kind, and n (1 to 50). locale is zh_CN, en, ja, and the other Bogus locales. kind must be one of that language. data.text is one value per line.\nOmitting locale uses zh_CN, except enname and ennick, which stay on en. If Bogus is missing, generation fails and the tools page uses its built-in data."
http.doc.text = "Text encode and decode. Still available when other modules are off.\ntext or message: source. Empty is allowed.\nop: b64enc, b64dec, urlenc, urldec, utf8hex, utf8unhex, gbkhex, gbkunhex, uesc, uunesc, upper, lower, collapse, dropempty, json, stats.\ndata.text is the result. An unknown op returns 802."
http.doc.fx = "Currency conversion. Still available when other modules are off.\namount: the number.\nfrom: source unit, such as USD or CNY.\nto: target unit, or all (default, every unit).\nReads the Bank of China middle rate. A success or a failure is cached for 10 minutes. If the query fails, the 2026-10-10 table is used.\ndata.text is the result. data.live is false when the default table was used."
http.doc.ipcity = "IP city lookup. Still available when other modules are off.\nip: an IP or a domain. Empty looks up this PC.\nUses the app HTTP proxy. Tries ip-api.com, then ipinfo.io, then api.ip.sb.\nA private or invalid address returns 802.\ndata has ip, country, region, city, isp, and text. lat and lon are included when a point was returned."
http.doc.mac = "MAC vendor lookup. Still available when other modules are off.\nmac: a MAC address or prefix. Colons, dashes, dots, or plain hex.\nUses the app HTTP proxy. Tries macaddresslookup.app, then api.macvendors.com, then macverify.com.\nA locally administered address has no IEEE registrant and returns 802 without a network call.\ndata has mac, company, country, address, block, local, multicast, and text."
http.doc.usb = "USB ID lookup. Still available when other modules are off.\nvid: four hex digits. pid is optional.\nid can be vid, vid:pid, 0xvid, or VID_xxxx&PID_xxxx.\nThe list is the public usb.ids file. It is cached in tmp for 7 days.\nReturns the vendor, product, model, and interfaces recorded for that ID.\nAn unknown vendor returns 802. An unknown product still returns the vendor.\ndata has vid, pid, vendor, product, model, interfaces, and text."
http.doc.enc = "Turns one code point into GBK, GB18030, Big5, Shift_JIS, EUC-KR, and Latin-1 bytes, as spaced hex. Still available when other modules are off.\ncp: decimal, 0x, or U+. text or ch may be one character instead.\nAn encoding that cannot store the character is an empty string. Latin-1 is empty above U+00FF. A bad code point returns 802."
http.doc.fonts = "Lists installed font families, sorted for the current language. Vertical fonts whose names start with @ are omitted. The list is cached for 10 minutes. The Unicode, ASCII, and GBK charts use this list."
http.doc.qrmake = "Makes a QR code or barcode and returns a PNG. Still available when other modules are off.\ntext or message: payload.\nformat: qr (default), datamatrix, code128, code39, ean13, ean8, upca.\nencoding: utf8 (default), gbk, hex. Linear codes use the characters as written.\ndata.png is Base64. Empty text returns 802. A failed encode returns 500."
http.doc.qrscan = "Reads QR codes and barcodes from an image. Still available when other modules are off. Does not run OCR.\nbase64 or path: the image. Multipart is also accepted.\nformat: dict with boxes (default) or text.\nEach item has format, type, text, and box. A QR code's format is QRCode. No code returns 101."
http.doc.caststop = "Closes the screencast viewer and drops the current session.\nNo parameters. GET or POST."
http.doc.api = "Lists endpoints that are still on. A module that is off is omitted.\nGET only.\nlang: language of the descriptions, such as zh, en, ja, or ko. Omitted uses the app's current UI language.\nendpoints is the short list. Each apis item has method, path, summary, and params. The parameter text is the same as the HTTP tab."
http.doc.ocrmodels = "Lists the same engines and models as the main window.\nGET only. No parameters.\nengine returns only that engine's packs: winocr or onnx."
http.doc.ocropt = "Describes OCR options. Each item has title, toolTip, and default.\nGET only. No parameters. Recognition uses options on POST /api/ocr."
http.doc.ocr = "Reads text in an image. Windows OCR does not load OpenCV. ONNX needs a model.\nbase64: the image. multipart file or image also works.\noptions: omitted fields follow the main window.\noptions.data.format: dict with boxes, or text.\noptions.ocr.engine: empty follows the window, winocr is Windows OCR, onnx is ONNX.\noptions.ocr.language: a model variant or a Windows OCR language.\noptions.ocr.device: cpu / gpu / intel.\noptions.ocr.barcode: true also scans barcodes."
http.doc.qr = "Scans barcodes and QR codes only. Does not run OCR. Needs ZXing.dll.\nPOST /api/qrcode is the Umi-OCR path. /api/barcode and /api/barcodes are the same.\nbase64 or path: the image. multipart also works.\nformat: dict with boxes (default) or text.\nEach hit has format, type, text, and box. A QR code's format is QRCode."
http.doc.asrmodels = "Lists speech-recognition models, including Sherpa and installed Windows recognizers.\nGET only.\nengine returns only that engine: sherpa, winrt (or windows).\nEach item has engine, id, name, type, streaming, sample_rate, and culture."
http.doc.asr = "Transcribes one audio clip. A Windows recognizer uses CPU only.\nbase64 or path: the audio. path is a local absolute path.\nmodel or asr_model: display name. Omitted uses the current offline model.\nlang: default auto.\nitn: model inverse text normalization, default true.\npostprocess: rule cleanup, default true.\ndevice or compute: auto / gpu / cpu / igpu. Ignored for Windows recognizers."
http.doc.ttsengines = "Lists speech-synthesis engines only. Does not scan models or voices.\nGET only. No parameters.\nengine is sherpa, sapi, winrt, or edge. name is the label."
http.doc.ttsmodels = "Lists speech-synthesis models and voices: Sherpa, SAPI, Windows, and Edge.\nGET only. When the desktop app is open, this returns the speech tab's loaded list, including every speaker.\nWithout that list, no parameters scans everything and keeps that result. The next full query returns the cache.\nengine returns only that engine: sherpa, sapi, winrt (or windows), edge.\nrefresh=1 or true ignores the cache and scans again. A full scan replaces the cache.\ncached tells whether this response reused a list already in memory."
http.doc.tts = "Speaks text to a WAV. The response carries wav_base64. At most 20000 characters.\ntext: the words to speak.\nengine: sherpa / sapi / winrt / edge. Empty picks one.\nmodel: a Sherpa name, or SAPI / Windows / Edge Online.\nvoice: a voice id such as sapi:…, winrt:…, or edge:….\nspeaker_id: voice index, default 0.\nspeed: 0.5–2, default 1. volume: 0–100, default 100.\ndevice: Sherpa only, auto / gpu / cpu / igpu."
http.doc.tts.sapi = "Speaks with a local SAPI voice.\ntext: the words to speak.\nengine: sapi.\nvoice: optional, a sapi: voice. Omitted uses the default.\nspeed and volume match /api/tts."
http.doc.tts.win = "Speaks with Windows speech. Nothing is heard when no voice is installed.\ntext: the words to speak.\nengine: winrt.\nvoice: optional, a winrt: voice."
http.doc.tts.edge = "Speaks with Edge online voices. Needs network access.\ntext: the words to speak.\nengine: edge.\nvoice: an edge: voice, for example edge:ko-KR-SunHiNeural."
http.doc.ttsdevices = "Lists active playback devices.\nGET only. No parameters.\nid is the device id, name is the label, index is the order, and default true is the default device."
http.doc.ttsspeak = "Synthesizes speech and plays it on this PC. The response has no audio. Synthesis fields match /api/tts.\ntext: the words to speak.\ndevices: one or more outputs. Use an id, name, or index from /api/tts/devices. Omit it to use the default device.\nplay: queue waits its turn; now interrupts the current clip and plays at once. Default is queue.\ndevice is still the Sherpa compute device, not a speaker.\nLoopback callers only; requests from the LAN get code 403."
http.doc.itn = "Turns spoken numbers and similar phrases into written form (WeText plus rules). Follows the ASR module switch.\ntext: the phrase, for example a spoken date."
http.doc.translate = "Batch translation. Uses the selected translate LLM, or an installed local model when no LLM is ready.\nitems: an array of strings.\nsrc: source language, such as zh.\ndst: target language, such as en.\nnative / learn: optional native / learning language for auto mode.\nengine: auto (default), onnx, chrome, or llm.\nmodel: with engine=onnx, the local ONNX model - direction key such as zh-en, or folder name such as opus-mt-zh-en-onnx.\nllm: LLM endpoint name; without engine=onnx, model is an alias for it.\nGET /api/translate/langs lists the languages, engines and models."
http.doc.chat = "Talks to the configured chat LLM.\ntext: the user message. Audio can be sent instead.\ntts: true also speaks the reply. The response then includes wav_base64.\nagent: true enables search and local file tools.\nengine: voice engine used when the reply is spoken, such as sapi."
http.doc.chat.tts = "Talks, then speaks the reply.\ntext: the user message.\ntts: true.\nengine: the voice engine, sapi in the sample.\nThe response includes the reply text and wav_base64."
http.doc.facemodels = "Lists ONNX files used for face detection and recognition.\nGET only. No parameters."
http.doc.face = "Detects faces, builds an embedding, or compares two images. Needs installed face models.\nbase64 or path: one image.\nbase64_b: a second image, used for comparison."
