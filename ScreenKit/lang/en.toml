ocr.win.hint = "Built into Windows and especially fast. No model download and no OpenCV. One installed language at a time, or Chinese+English: both run once, then Chinese characters stay from the Chinese pass and Latin text comes from the English pass. Boxes are upright rectangles. No rotation step, no confidence, and no GPU choice. It does not shrink to the detection side limit; small text is enlarged first. Weaker than ONNX on tilted text."
