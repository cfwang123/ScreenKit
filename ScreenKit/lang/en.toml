http.doc.status = "Whether the server is listening, and whether OCR, speech, translate, chat, and face are on.\nGET only. No parameters.\nThe response includes http_enabled, http_ocr, ocr_engine, asr_models, llm_chat, and similar fields."
http.doc.toast = "Shows a toast at the bottom of the primary monitor. It does not take focus. Stays available when other modules are off.\ntext or message: the words to show.\nms: milliseconds, default 1900, clamped to 800–8000.\nGET uses the query string. POST uses JSON. An empty text returns 802."
http.doc.zhconv = "Simplified/traditional conversion with the system table. Traditional follows Taiwan zh-TW, character by character.\ntext or message: source text.\nto: trad (default) or simp.\ndata.text is the result. data.to is the direction."
http.doc.calendar = "Converts a Gregorian date with Windows calendars. Chinese lunar includes the sexagenary year and leap month. The date is taken at local noon.\ndate: yyyy-MM-dd. Omitted means today.\ncal: lunar (default), gregorian, jp, jplunar, tw, ko, vilunar, he, hijri, umalqura, fa, th, julian.\nThe response includes ganzhi, month, day, week, leap, and gregorian."
http.doc.jpyomi = "Turns a Japanese sentence into readings. The Japanese language feature must be installed. Windows has no matching Chinese pinyin API.\ntext or message: Japanese.\nmono: true reads character by character. The default is by word.\nruby mixes the text with readings. yomi is the reading only."
http.doc.text = "Text encode and decode. Still available when other modules are off.\ntext or message: source. Empty is allowed.\nop: b64enc, b64dec, urlenc, urldec, utf8hex, utf8unhex, gbkhex, gbkunhex, uesc, uunesc, upper, lower, collapse, dropempty, json, stats.\ndata.text is the result. An unknown op returns 802."
http.doc.qrmake = "Makes a QR code or barcode and returns a PNG. Still available when other modules are off.\ntext or message: payload.\nformat: qr (default), datamatrix, code128, code39, ean13, ean8, upca.\nencoding: utf8 (default), gbk, hex. Linear codes use the characters as written.\ndata.png is Base64. Empty text returns 802. A failed encode returns 500."
http.doc.qrscan = "Reads QR codes and barcodes from an image. Still available when other modules are off. Does not run OCR.\nbase64 or path: the image. Multipart is also accepted.\nformat: dict with boxes (default) or text.\nEach item has type, text, and box. No code returns 101."
http.doc.caststop = "Closes the screencast viewer and drops the current session.\nNo parameters. GET or POST."
http.doc.api = "Lists endpoints that are still on. A module that is off is omitted.\nGET only. No parameters."
http.doc.ocropt = "Describes OCR options. Each item has title, toolTip, and default.\nGET only. No parameters. Recognition uses options on POST /api/ocr."
http.doc.ocr = "Reads text in an image. Windows OCR does not load OpenCV. ONNX needs a model.\nbase64: the image. multipart file or image also works.\noptions: omitted fields follow the main window.\noptions.data.format: dict with boxes, or text.\noptions.ocr.engine: empty follows the window, winocr is Windows OCR, onnx is ONNX.\noptions.ocr.language: a model variant or a Windows OCR language.\noptions.ocr.device: cpu / gpu / intel.\noptions.ocr.barcode: true also scans barcodes."
http.doc.qr = "Scans barcodes and QR codes only. Does not run OCR. Needs ZXing.dll.\nbase64 or path: the image. multipart also works.\nformat: dict with boxes (default) or text.\nEach hit has type, text, and box."
http.doc.asrmodels = "Lists speech-recognition models, including Sherpa and installed Windows recognizers.\nGET only. No parameters.\nEach item has name, type, streaming, sample_rate, and culture."
http.doc.asr = "Transcribes one audio clip. A Windows recognizer uses CPU only.\nbase64 or path: the audio. path is a local absolute path.\nmodel or asr_model: display name. Omitted uses the current offline model.\nlang: default auto.\nitn: model inverse text normalization, default true.\npostprocess: rule cleanup, default true.\ndevice or compute: auto / gpu / cpu / igpu. Ignored for Windows recognizers."
http.doc.ttsengines = "Lists speech-synthesis engines only. Does not scan models or voices.\nGET only. No parameters.\nengine is sherpa, sapi, winrt, or edge. name is the label."
http.doc.ttsmodels = "Lists speech-synthesis models and voices: Sherpa, SAPI, Windows, and Edge.\nGET only. With no parameters it scans everything and keeps that result. The next full query returns the cache.\nengine returns only that engine: sherpa, sapi, winrt (or windows), edge.\nrefresh=1 or true ignores the cache and scans again. A full scan replaces the cache.\ncached tells whether this response reused the last result."
http.doc.tts = "Speaks text to a WAV. The response carries wav_base64. At most 20000 characters.\ntext: the words to speak.\nengine: sherpa / sapi / winrt / edge. Empty picks one.\nmodel: a Sherpa name, or SAPI / Windows / Edge Online.\nvoice: a voice id such as sapi:…, winrt:…, or edge:….\nspeaker_id: voice index, default 0.\nspeed: 0.5–2, default 1. volume: 0–100, default 100.\ndevice: Sherpa only, auto / gpu / cpu / igpu."
http.doc.tts.sapi = "Speaks with a local SAPI voice.\ntext: the words to speak.\nengine: sapi.\nvoice: optional, a sapi: voice. Omitted uses the default.\nspeed and volume match /api/tts."
http.doc.tts.win = "Speaks with Windows speech. Nothing is heard when no voice is installed.\ntext: the words to speak.\nengine: winrt.\nvoice: optional, a winrt: voice."
http.doc.tts.edge = "Speaks with Edge online voices. Needs network access.\ntext: the words to speak.\nengine: edge.\nvoice: an edge: voice, for example edge:ko-KR-SunHiNeural."
http.doc.itn = "Turns spoken numbers and similar phrases into written form (WeText plus rules). Follows the ASR module switch.\ntext: the phrase, for example a spoken date."
http.doc.translate = "Batch translation with the configured translate LLM. Fails when none is configured.\nitems: an array of strings.\nsrc: source language, such as zh.\ndst: target language, such as en."
http.doc.chat = "Talks to the configured chat LLM.\ntext: the user message. Audio can be sent instead.\ntts: true also speaks the reply. The response then includes wav_base64.\nagent: true enables search and local file tools.\nengine: voice engine used when the reply is spoken, such as sapi."
http.doc.chat.tts = "Talks, then speaks the reply.\ntext: the user message.\ntts: true.\nengine: the voice engine, sapi in the sample.\nThe response includes the reply text and wav_base64."
http.doc.facemodels = "Lists ONNX files used for face detection and recognition.\nGET only. No parameters."
http.doc.face = "Detects faces, builds an embedding, or compares two images. Needs installed face models.\nbase64 or path: one image.\nbase64_b: a second image, used for comparison."
