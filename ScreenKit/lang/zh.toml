fc.hint = "把文件或文件夹复制、剪切，或做成符号链接、硬链接。同分区剪切优先改名。硬链接必须同一分区，文件夹会按目录给每个文件建硬链接。点「注册菜单」后，资源管理器右键有快速剪切、复制、删除、符号链接、硬链接、统计大小、复制路径和参数设置。剪切、复制或链接之后，文件夹空白处出现快速粘贴。已经注册过的菜单会在程序启动时重写。当前用户注册，不用管理员。改界面语言后需要再注册一次。Windows 11 在「显示更多选项」里。一次选中超过大约 100 项时，系统可能不显示这项菜单。窗口里也可以永久删除，或删除到回收站，开始前会再确认。拖到列表上加入源，拖到目标上设为文件夹；拖进去的是文件时，用它所在的文件夹。"
