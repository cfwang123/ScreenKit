http.doc.status = "서버가 듣고 있는지, OCR·음성·번역·대화·얼굴이 켜져 있는지 봅니다.\nGET만 됩니다. 매개변수 없음.\nhttp_enabled, http_ocr, ocr_engine, asr_models, llm_chat 등을 돌려줍니다."
http.doc.toast = "주 모니터 아래에 Toast를 띄웁니다. 포커스를 가져가지 않습니다. 다른 모듈을 꺼도 됩니다.\ntext 또는 message: 표시할 글.\nms: 밀리초. 기본 1900, 800～8000.\nGET는 쿼리, POST는 JSON. text가 비면 802."
http.doc.zhconv = "시스템 표로 간체와 번체를 바꿉니다. 번체는 대만 zh-TW이며 글자 단위입니다.\ntext 또는 message: 원문.\nto: trad는 번체(기본), simp는 간체.\ndata.text가 결과, data.to가 방향입니다."
http.doc.pinyin = "한자를 병음으로 바꿉니다. text 가 없으면 data.installed 만 반환합니다.\ntext: 원문. mode: py 는 병음(기본), init 는 첫 글자.\nDLL 이 없으면 803. data.text 가 결과입니다."
http.doc.calendar = "양력을 Windows 역법으로 바꿉니다. 중국 음력은 간지와 윤달을 포함합니다. 날짜는 현지 정오입니다.\ndate: yyyy-MM-dd. 생략하면 오늘.\ncal: lunar(기본), gregorian, jp, jplunar, tw, ko, vilunar, he, hijri, umalqura, fa, th, julian.\nganzhi, month, day, week, leap, gregorian을 돌려줍니다."
http.doc.jpyomi = "일본어 문장을 읽기로 바꿉니다. 일본어 언어 기능이 필요합니다. 같은 중국어 병음 API는 없습니다.\ntext 또는 message: 일본어.\nmono: true면 한 글자씩. 기본은 낱말.\nruby는 원문과 읽기, yomi는 읽기만입니다."
http.doc.fake = "테스트 데이터를 만듭니다. kind가 없으면 data.installed를 반환합니다.\n설치된 경우 data.langs는 언어와 그 언어의 분류, data.kinds는 분류 id와 문구 키입니다.\nlocale, kind, n(1~50)을 넘깁니다. kind는 그 언어에 있는 분류여야 합니다. data.text는 한 줄에 하나입니다.\nlocale을 생략하면 zh_CN입니다. enname과 ennick은 en입니다. 설치되지 않으면 생성은 실패하고 도구 페이지는 내장 데이터를 사용합니다."
http.doc.fx = "통화 환산. 다른 모듈을 꺼도 됩니다.\namount: 수치.\nfrom: 원래 단위(USD, CNY 등).\nto: 대상 단위 또는 all(기본, 전부).\n중국은행 매매기준율을 읽습니다. 성공과 실패 모두 10분 캐시합니다. 실패하면 2026-10-10 시세를 씁니다.\ndata.text가 결과입니다. data.live가 false이면 기본 시세입니다."
http.doc.ipcity = "IP city lookup. Still available when other modules are off.\nip: an IP or a domain. Empty looks up this PC.\nUses the app HTTP proxy. Tries ip-api.com, then ipinfo.io, then api.ip.sb.\nA private or invalid address returns 802.\ndata has ip, country, region, city, isp, and text. lat and lon are included when a point was returned."
http.doc.mac = "MAC vendor lookup. Still available when other modules are off.\nmac: a MAC address or prefix. Colons, dashes, dots, or plain hex.\nUses the app HTTP proxy. Tries macaddresslookup.app, then api.macvendors.com, then macverify.com.\nA locally administered address has no IEEE registrant and returns 802 without a network call.\ndata has mac, company, country, address, block, local, multicast, and text."
http.doc.usb = "USB ID lookup. Still available when other modules are off.\nvid: four hex digits. pid is optional.\nid can be vid, vid:pid, 0xvid, or VID_xxxx&PID_xxxx.\nThe list is the public usb.ids file. It is cached in tmp for 7 days.\nReturns the vendor, product, model, and interfaces recorded for that ID.\nAn unknown vendor returns 802. An unknown product still returns the vendor.\ndata has vid, pid, vendor, product, model, interfaces, and text."
http.doc.qrmake = "QR 또는 바코드를 PNG로 만듭니다. 다른 모듈을 꺼도 됩니다.\ntext 또는 message: 내용.\nformat: qr(기본), datamatrix, code128, code39, ean13, ean8, upca.\nencoding: utf8(기본), gbk, hex. 1차원 코드는 글자 그대로 씁니다.\ndata.png는 Base64입니다. 비면 802, 실패는 500."
http.doc.qrscan = "그림에서 QR과 바코드를 읽습니다. 다른 모듈을 꺼도 됩니다. OCR은 하지 않습니다.\nbase64 또는 path: 그림. multipart도 됩니다.\nformat: dict(좌표 포함, 기본) 또는 text.\n항목마다 type, text, box. 없으면 101."
http.doc.caststop = "화면 전송 창을 바로 닫고 현재 수신을 끊습니다.\n매개변수 없음. GET와 POST 모두 됩니다."
http.doc.api = "지금 켜진 엔드포인트를 나열합니다. 끈 모듈은 빠집니다.\nGET만 됩니다.\nlang: 설명 언어. zh, en, ja, ko 등. 생략하면 프로그램의 현재 표시 언어.\nendpoints는 짧은 목록입니다. apis의 각 항목은 method, path, summary, params를 가집니다. 매개변수 글은 HTTP 탭과 같습니다."
http.doc.ocrmodels = "메인 창과 같은 인식 엔진과 모델을 나열합니다.\nGET만 됩니다. 매개변수 없음."
http.doc.ocropt = "OCR 매개변수 설명을 돌려줍니다. 항목마다 title, toolTip, default가 있습니다.\nGET만 됩니다. 실제 인식은 POST /api/ocr의 options를 씁니다."
http.doc.ocr = "그림 속 글자를 읽습니다. Windows OCR은 OpenCV를 쓰지 않습니다. ONNX는 모델이 필요합니다.\nbase64: 그림. multipart의 file 또는 image도 됩니다.\noptions: 비운 항목은 메인 창을 따릅니다.\noptions.data.format: dict는 좌표, text는 본문.\noptions.ocr.engine: 비우면 창을 따르고, winocr는 Windows OCR, onnx는 ONNX.\noptions.ocr.language: 모델 또는 Windows OCR 언어.\noptions.ocr.device: cpu / gpu / intel.\noptions.ocr.barcode: true면 바코드도 읽습니다."
http.doc.qr = "바코드와 QR만 읽습니다. OCR은 하지 않습니다. ZXing.dll이 필요합니다.\nbase64 또는 path: 그림. multipart도 됩니다.\nformat: dict(기본, 좌표) 또는 text.\n항목마다 type, text, box가 있습니다."
http.doc.asrmodels = "음성 인식 모델을 나열합니다. Sherpa와 설치된 Windows 인식기를 포함합니다.\nGET만 됩니다. 매개변수 없음.\n항목마다 name, type, streaming, sample_rate, culture가 있습니다."
http.doc.asr = "오디오를 글로 바꿉니다. Windows 인식기는 CPU만 씁니다.\nbase64 또는 path: 오디오. path는 이 PC의 절대 경로.\nmodel 또는 asr_model: 표시 이름. 비우면 현재 오프라인 모델.\nlang: 기본 auto.\nitn: 모델 역텍스트 정규화. 기본 true.\npostprocess: 규칙 후처리. 기본 true.\ndevice 또는 compute: auto / gpu / cpu / igpu. Windows 인식기는 무시합니다."
http.doc.ttsengines = "음성 합성 엔진만 나열합니다. 모델과 음성은 스캔하지 않습니다.\nGET만 됩니다. 매개변수 없음.\nengine는 sherpa, sapi, winrt, edge입니다. name은 표시 이름입니다."
http.doc.ttsmodels = "음성 합성 모델과 음성을 나열합니다. Sherpa, SAPI, Windows, Edge를 포함합니다.\nGET만 됩니다. 매개변수가 없으면 전부를 스캔하고 그 결과를 기억합니다. 다음 전체 조회는 캐시입니다.\nengine: 그 엔진만. sherpa, sapi, winrt(windows), edge.\nrefresh: 1 또는 true면 캐시를 쓰지 않고 다시 스캔합니다. 전체 스캔은 캐시를 바꿉니다.\ncached는 지난 결과를 썼는지입니다."
http.doc.tts = "글을 WAV로 만듭니다. 응답은 wav_base64. 최대 20000자.\ntext: 읽을 글.\nengine: sherpa / sapi / winrt / edge. 비우면 자동.\nmodel: Sherpa 표시 이름, 또는 SAPI / Windows / Edge Online.\nvoice: sapi:…, winrt:…, edge:… 같은 음성.\nspeaker_id: 음성 번호. 기본 0.\nspeed: 0.5～2, 기본 1. volume: 0～100, 기본 100.\ndevice: Sherpa만. auto / gpu / cpu / igpu."
http.doc.tts.sapi = "이 PC의 SAPI 음성으로 읽습니다.\ntext: 읽을 글.\nengine: sapi.\nvoice: 선택. sapi: 음성. 비우면 기본.\nspeed와 volume은 /api/tts와 같습니다."
http.doc.tts.win = "Windows 음성으로 읽습니다. 음성이 없으면 소리가 나지 않습니다.\ntext: 읽을 글.\nengine: winrt.\nvoice: 선택. winrt: 음성."
http.doc.tts.edge = "Edge 온라인 음성으로 읽습니다. 네트워크가 필요합니다.\ntext: 읽을 글.\nengine: edge.\nvoice: edge: 음성. 예: edge:ko-KR-SunHiNeural."
http.doc.ttsdevices = "사용 중인 재생 장치를 나열합니다.\nGET만 가능. 매개변수 없음.\nid는 장치 ID, name은 이름, index는 번호, default가 true이면 기본 장치입니다."
http.doc.ttsspeak = "합성한 뒤 이 PC에서 바로 재생합니다. 오디오는 반환하지 않습니다. 합성 매개변수는 /api/tts와 같습니다.\ntext: 읽을 글.\ndevices: 재생 장치. 여러 개 가능. /api/tts/devices의 id, 이름, index. 생략하면 기본 장치.\nplay: queue는 대기, now는 현재 재생을 끊고 바로 재생. 기본값은 queue.\ndevice는 Sherpa 계산 장치이며 스피커가 아닙니다."
http.doc.itn = "말한 숫자 등을 글로 바꿉니다(WeText와 규칙). ASR 모듈 스위치를 따릅니다.\ntext: 처리할 문장. 날짜를 읽은 문장 등."
http.doc.translate = "설정된 번역 LLM으로 여러 줄을 번역합니다. 설정이 없으면 실패합니다.\nitems: 문자열 배열.\nsrc: 출발 언어. 예 zh.\ndst: 도착 언어. 예 en."
http.doc.chat = "설정된 대화 LLM과 이야기합니다.\ntext: 사용자 문장. 오디오를 넣을 수도 있습니다.\ntts: true면 대답도 읽고 wav_base64를 돌려줍니다.\nagent: true면 검색과 로컬 파일 도구를 켭니다.\nengine: 대답을 읽을 음성 엔진. 예 sapi."
http.doc.chat.tts = "대화한 뒤 대답을 바로 읽습니다.\ntext: 사용자 문장.\ntts: true.\nengine: 읽기 엔진. 예는 sapi.\n대답 글과 wav_base64를 돌려줍니다."
http.doc.facemodels = "얼굴 검출과 인식에 쓰는 ONNX를 나열합니다.\nGET만 됩니다. 매개변수 없음."
http.doc.face = "얼굴 검출, 특징, 또는 두 장의 비교입니다. 얼굴 모델이 필요합니다.\nbase64 또는 path: 첫 그림.\nbase64_b: 비교할 둘째 그림."
