ocr.pack.rapid = "Rapid PP-OCR. 검출, 방향 분류, 인식이 있고 GPU·내장 GPU·CPU, 변 길이와 임계값을 고르며 신뢰도를 돌려줍니다. 언어는 이 팩의 변형에 따릅니다."
