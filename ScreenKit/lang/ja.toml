http.doc.status = "サーバーが待受中か、OCR・音声・翻訳・対話・顔が有効かを返します。\nGET のみ。パラメータなし。\nhttp_enabled、http_ocr、ocr_engine、asr_models、llm_chat などを含みます。"
http.doc.toast = "主ディスプレイ下部に Toast を出します。フォーカスは取りません。他モジュールを切っても使えます。\ntext または message：表示する文字。\nms：ミリ秒。既定 1900、800～8000。\nGET はクエリ、POST は JSON。text が空なら 802。"
http.doc.zhconv = "システムの変換表で簡体字と繁体字を変換します。繁体字は台湾の zh-TW で、一字ずつです。\ntext または message：原文。\nto：trad は繁体字（既定）、simp は簡体字。\ndata.text が結果、data.to が方向です。"
http.doc.calendar = "西暦を Windows の暦に換算します。中国の旧暦は干支と閏月を含みます。日付は現地の正午です。\ndate：yyyy-MM-dd。省略すると今日。\ncal：lunar（既定）、gregorian、jp、jplunar、tw、ko、vilunar、he、hijri、umalqura、fa、th、julian。\nganzhi、month、day、week、leap、gregorian を返します。"
http.doc.jpyomi = "日本語の文を読みにします。日本語の言語機能が必要です。中国語ピンインの同等 API はありません。\ntext または message：日本語。\nmono：true で一字ずつ。既定は語句。\nruby は原文と読み、yomi は読みだけです。"
http.doc.qrmake = "QR またはバーコードの PNG を作ります。他モジュールを切っても使えます。\ntext または message：内容。\nformat：qr（既定）、datamatrix、code128、code39、ean13、ean8、upca。\nencoding：utf8（既定）、gbk、hex。一次元コードは文字をそのまま書きます。\ndata.png は Base64。空なら 802、失敗は 500。"
http.doc.qrscan = "画像から QR とバーコードを読みます。他モジュールを切っても使えます。OCR はしません。\nbase64 または path：画像。multipart も可。\nformat：dict（座標つき、既定）または text。\n各項目は type、text、box。見つからなければ 101。"
http.doc.caststop = "投屏の画面を直ちに閉じ、受信を切ります。\nパラメータなし。GET と POST のどちらでも可。"
http.doc.api = "いま有効なエンドポイントを列挙します。切ったモジュールは出ません。\nGET のみ。\nlang：説明の言語。zh、en、ja、ko など。省略するとプログラムの現在の表示言語。\nendpoints は短い一覧です。apis の各項目は method、path、summary、params を持ちます。パラメータの文は HTTP タブと同じです。"
http.doc.ocrmodels = "メイン画面と同じ認識エンジンとモデルを列挙します。\nGET のみ。パラメータなし。"
http.doc.ocropt = "OCR のパラメータ説明を返します。各項目に title、toolTip、default があります。\nGET のみ。認識自体は POST /api/ocr の options を使います。"
http.doc.ocr = "画像の文字を読みます。Windows OCR は OpenCV を使いません。ONNX はモデルが必要です。\nbase64：画像。multipart の file または image も可。\noptions：省略した項目はメイン画面に従います。\noptions.data.format：dict は座標付き、text は本文。\noptions.ocr.engine：空は画面に従う、winocr は Windows OCR、onnx は ONNX。\noptions.ocr.language：モデルまたは Windows OCR の言語。\noptions.ocr.device：cpu / gpu / intel。\noptions.ocr.barcode：true でバーコードも読みます。"
http.doc.qr = "バーコードと QR だけを読みます。OCR はしません。ZXing.dll が必要です。\nbase64 または path：画像。multipart も可。\nformat：dict（既定、座標付き）または text。\n各結果に type、text、box があります。"
http.doc.asrmodels = "音声認識モデルを列挙します。Sherpa とインストール済みの Windows 認識器を含みます。\nGET のみ。パラメータなし。\n各項目に name、type、streaming、sample_rate、culture があります。"
http.doc.asr = "音声を文字にします。Windows 認識器は CPU のみです。\nbase64 または path：音声。path はこの PC の絶対パス。\nmodel または asr_model：表示名。省略すると現在のオフラインモデル。\nlang：既定 auto。\nitn：モデルの逆テキスト正規化。既定 true。\npostprocess：規則による後処理。既定 true。\ndevice または compute：auto / gpu / cpu / igpu。Windows 認識器は無視します。"
http.doc.ttsengines = "音声合成エンジンだけを返します。モデルと話者は調べません。\nGET のみ。パラメータなし。\nengine は sherpa、sapi、winrt、edge。name は表示名です。"
http.doc.ttsmodels = "音声合成のモデルと話者を列挙します。Sherpa、SAPI、Windows、Edge を含みます。\nGET のみ。パラメータなしのときは全部を調べ、その結果を覚えておきます。次の全件取得はキャッシュです。\nengine：そのエンジンだけ。sherpa、sapi、winrt（windows）、edge。\nrefresh：1 または true でキャッシュを使わず再取得。全件の再取得はキャッシュを更新します。\ncached は前回の結果を返したかどうかです。"
http.doc.tts = "文章を WAV にします。応答は wav_base64。最大 20000 字。\ntext：読む文章。\nengine：sherpa / sapi / winrt / edge。空なら自動。\nmodel：Sherpa の表示名、または SAPI / Windows / Edge Online。\nvoice：sapi:…、winrt:…、edge:… などの話者。\nspeaker_id：話者番号。既定 0。\nspeed：0.5～2、既定 1。volume：0～100、既定 100。\ndevice：Sherpa のみ。auto / gpu / cpu / igpu。"
http.doc.tts.sapi = "この PC の SAPI 話者で読みます。\ntext：読む文章。\nengine：sapi。\nvoice：省略可。sapi: の話者。省略すると既定。\nspeed と volume は /api/tts と同じです。"
http.doc.tts.win = "Windows の音声で読みます。話者が無いと音は出ません。\ntext：読む文章。\nengine：winrt。\nvoice：省略可。winrt: の話者。"
http.doc.tts.edge = "Edge のオンライン音声で読みます。ネットワークが必要です。\ntext：読む文章。\nengine：edge。\nvoice：edge: の話者。例 edge:ko-KR-SunHiNeural。"
http.doc.itn = "話し言葉の数字などを書き言葉にします（WeText と規則）。ASR モジュールのスイッチに従います。\ntext：対象の文。日付の読み上げなど。"
http.doc.translate = "設定済みの翻訳 LLM でまとめて訳します。未設定なら失敗します。\nitems：文字列の配列。\nsrc：翻訳元。例 zh。\ndst：翻訳先。例 en。"
http.doc.chat = "設定済みの対話 LLM と話します。\ntext：ユーザーの文。音声を渡すこともできます。\ntts：true なら返答も読み、wav_base64 を返します。\nagent：true で検索とローカルファイルのツールを使います。\nengine：返答を読む音声エンジン。例 sapi。"
http.doc.chat.tts = "対話したあと、返答をすぐ読みます。\ntext：ユーザーの文。\ntts：true。\nengine：読み上げエンジン。例は sapi。\n返答の文字と wav_base64 を返します。"
http.doc.facemodels = "顔検出と認識に使う ONNX を列挙します。\nGET のみ。パラメータなし。"
http.doc.face = "顔検出、特徴、または二枚の比較です。顔モデルが必要です。\nbase64 または path：一枚目。\nbase64_b：比較用の二枚目。"
