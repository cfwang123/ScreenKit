ocr.win.empty = "使える Windows OCR 言語がありません。Windows の設定で言語を追加し、光学式文字認識をインストールしてください。"
ocr.win.hint = "Windows 標準の OCR で、特に高速です。モデルのダウンロードも OpenCV も不要。インストール済みの言語を一度に一つ使うか、中英混合（中国語と英語を各一回認識し、漢字は中国語、英文は英語の結果）を選べます。枠は正立の矩形で、向き分類も信頼度も GPU 選択もありません。検出辺の上限では縮小しません。小さい文字は先に拡大します。傾きは ONNX より弱いです。"
ocr.pack.umi = "Umi の server モデルで、mobile より大きいです。簡体字中国語、英語、繁体字中国語、日本語、韓国語、ロシア語。簡体字は検出 v4 または v3。検出、向き分類、認識があり、GPU・内蔵 GPU・CPU、辺の上限と閾値を選べ、信頼度を返します。"
ocr.pack.rapidch = "PP-OCRv4 mobile。簡体字中国語だけ。小さくて速いです。検出、向き分類、認識があり、GPU・内蔵 GPU・CPU、辺の上限と閾値を選べ、信頼度を返します。"
ocr.pack.rapidi18n = "PP-OCR mobile。一度に一つの言語：簡体字、英語、繁体字、日本語、韓国語、ロシア語、ラテン文字、アラビア語。モデルは小さめ。検出、向き分類、認識があり、GPU・内蔵 GPU・CPU、辺の上限と閾値を選べ、信頼度を返します。"
ocr.pack.rapid = "Rapid の PP-OCR。検出、向き分類、認識があり、GPU・内蔵 GPU・CPU、辺の上限と閾値を選べ、信頼度を返します。言語はこのパックのバリアントによります。"
ocr.pack.onnx = "ONNX PP-OCR。検出、向き分類、認識があり、GPU・内蔵 GPU・CPU、辺の上限と閾値を選べ、信頼度を返します。言語はこのパックのバリアントによります。"
