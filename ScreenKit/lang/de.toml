web.everb.hint = "Grundform eines Verbs, Adjektiv oder Substantiv eingeben. Der Typ ist automatisch: zuerst die Tabellen unregelmäßiger Wörter, dann die Endung; bei Unsicherheit gilt das Wort als Verb, der Typ lässt sich ändern. Verben zeigen Grundformen, sechzehn Zeitformen, Verneinung, Fragen, Passiv, Modalverben, Konjunktiv, Imperativ, Frageanhängsel, Kausativ und regionale Varianten. Adjektive zeigen Komparativ und Superlativ, Vergleichsmuster, Adverb und Substantiv. Substantive zeigen Plural, Artikel, Possessivformen und Kongruenz. Der Schrägstrich trennt Varianten; die Tabellen nutzen die erste.Jeder Typ zeigt außerdem Register und Ton: formell, neutral, umgangssprachlich, emphatisch, abgeschwächt, Ausruf und Vermutung.Jeder Ton hat auch eine negative Form: Modalverben zeigen can't, mustn't, don't have to, und Register, Vermutung und Hörensagen haben negative Varianten wie it is said not to walk und isn't it beautiful."
