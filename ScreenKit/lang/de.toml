fc.hint = "Dateien und Ordner kopieren, verschieben oder verknüpfen. Auf demselben Laufwerk wird umbenannt. Eine harte Verknüpfung bleibt auf demselben Laufwerk. Die Registrierung ergänzt Ausschneiden, Kopieren, Löschen, symbolischen Link, harte Verknüpfung, Größe, Pfade und Einstellungen. Eine vorhandene Registrierung wird beim Start neu geschrieben. Nach einem Sprachwechsel erneut registrieren. Unter Windows 11 steht der Eintrag bei Weitere Optionen anzeigen. Das Fenster kann auch endgültig löschen oder in den Papierkorb verschieben und fragt vorher nach. Auf die Liste ziehen fügt Quellen hinzu. Auf das Ziel ziehen setzt diesen Ordner; eine Datei nimmt den übergeordneten Ordner."
