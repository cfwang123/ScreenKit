web.kverb.hint = "Zuerst den Typ wählen (Auto, Verb, Adjektiv, Substantiv), dann ein Wort eingeben oder aus der Liste wählen. Der Lautsprecher spielt die Form. 걷다 bedeutet gehen, 묻다 bedeutet fragen. Substantive werden mit 이다 gebeugt. Am Tabellenende stehen nordkoreanische (ㅂ네다), Rundfunk- (nur -시였습니다, abweichend vom Standard) und Yanbian-Endungen (-ㅁ다/슴다, -ㄴ다이); mit dem Standard identische Formen fehlen."
