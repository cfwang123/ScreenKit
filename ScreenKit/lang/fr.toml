ocr.pack.rapid = "Rapid 的 PP-OCR 模型。有检测、方向分类和识别，可选 GPU、核显或 CPU，可调边长和阈值，并给出置信度。语言看该包里的变体。"
ocr.pack.onnx = "ONNX PP-OCR。有检测、方向分类和识别，可选 GPU、核显或 CPU，可调边长和阈值，并给出置信度。语言看该包里的变体。"
